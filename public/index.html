<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The South Gate</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💂</text></svg>" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>The South Gate</h1>
        <p class="sub">Captain Jimbo's decisions come from Jev. Code decides what he's allowed to do.</p>
      </div>
      <button id="newGame" class="btn">New game</button>
    </header>

    <main class="layout">
      <section class="play" aria-label="Game">
        <div class="board-wrap">
          <div id="board" class="board" role="img" aria-label="Map of the gate and fields"></div>
          <div id="over" class="over" hidden>
            <div class="over-card">
              <p id="overKind" class="over-kind"></p>
              <h2 id="overTitle"></h2>
              <p id="overText"></p>
              <button id="again" class="btn primary">Play again</button>
            </div>
          </div>
        </div>

        <div class="hud">
          <div class="stat" title="Your health"><span aria-hidden="true">❤️</span> <span id="hp"></span></div>
          <div class="stat" title="Your gold"><span aria-hidden="true">🪙</span> <span id="gold"></span></div>
          <div id="inventory" class="inventory" aria-label="Inventory"></div>
        </div>
        <p id="inspect" class="inspect" hidden></p>

        <div class="controls">
          <div class="dpad" aria-label="Move">
            <button class="btn key" data-move="up" aria-label="Move up">↑</button>
            <button class="btn key" data-move="left" aria-label="Move left">←</button>
            <button class="btn key" data-move="down" aria-label="Move down">↓</button>
            <button class="btn key" data-move="right" aria-label="Move right">→</button>
          </div>
          <div class="actions">
            <button id="wait" class="btn">Wait <kbd>Space</kbd></button>
            <button id="sword" class="btn">Draw sword <kbd>Q</kbd></button>
            <button id="attack" class="btn danger">Attack <kbd>F</kbd></button>
            <span class="offer">
              <select id="offerItem" aria-label="Item to offer"></select>
              <button id="offer" class="btn">Offer</button>
            </span>
            <button id="showWrit" class="btn">Show writ</button>
          </div>
        </div>

        <form id="say" class="say" autocomplete="off">
          <input id="sayText" maxlength="280" placeholder="Say anything to Jimbo… (press T to type)" aria-label="Say something" />
          <button class="btn primary">Say</button>
        </form>

        <ol id="log" class="log" aria-live="polite" aria-label="What happened"></ol>
      </section>

      <aside class="brain" aria-label="Jimbo's brain">
        <div class="brain-head">
          <h2>Jimbo's brain <span class="pill">Jev</span></h2>
          <span id="thinking" class="thinking" hidden>thinking…</span>
        </div>
        <div id="meters" class="meters"></div>
        <div id="trace" class="trace"></div>
        <details class="impressions-box">
          <summary>What he remembers about you</summary>
          <ul id="impressions"></ul>
        </details>
        <details class="raw">
          <summary>Raw Jev request &amp; answers</summary>
          <pre id="raw">No request yet.</pre>
        </details>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="app.js" type="module"></script>
  </body>
</html>
