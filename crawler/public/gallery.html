<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monster Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #111; color: #e8e8e8; font: 11px "Press Start 2P", monospace; padding: 16px; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      p { color: #8a8a8a; margin: 0 0 14px; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      figure { margin: 0; background: #000; border: 2px solid #e8e8e8; padding: 6px; }
      figcaption { margin-top: 6px; line-height: 1.5; }
      canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
      button { font: inherit; color: #e8e8e8; background: #000; border: 2px solid #e8e8e8; padding: 8px 10px; cursor: pointer; }
      button.on { background: #e8e8e8; color: #000; }
      @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    </style>
    <script>
      // Opened as a file (double-click / Finder)? Browsers block the page's scripts and sound files then.
      if (!/^https?:$/.test(location.protocol))
        document.addEventListener("DOMContentLoaded", () => {
          const d = document.createElement("div");
          d.style.cssText = "position:fixed;inset:0;z-index:99;background:#000;color:#e8e8e8;display:grid;place-items:center;padding:24px;text-align:center;font:20px/1.5 monospace";
          d.innerHTML = '<div>This page has to be opened through the game server, not as a file.<br><br>1. In the project folder run: <b>npm run crawler</b><br>2. Open <b>http://localhost:5174/' + location.pathname.split("/").pop() + '</b></div>';
          document.body.append(d);
        });
    </script>
  </head>
  <body>
    <h1>MONSTER GALLERY</h1>
    <p>Each monster at the jaggedness used in the game. Tell Claude what to change: shapes, eyes, poses, colors.</p>
    <div class="row" id="modes"></div>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { SPECIES } from "./species.js";
      import { drawMonster, ART } from "./art.js";
      let shiny = false;
      const grid = document.getElementById("grid");
      const modes = document.getElementById("modes");
      const cells = Object.keys(SPECIES).map((s) => {
        const fig = document.createElement("figure");
        fig.innerHTML = `<canvas width="448" height="288"></canvas><figcaption style="color:${SPECIES[s].color}">${SPECIES[s].label.toUpperCase()}</figcaption>`;
        grid.append(fig);
        return { s, ctx: fig.querySelector("canvas").getContext("2d") };
      });
      const LEVELS = [[1, "SMOOTH (GAME)"], [2, "JAGGED x2"], [3, "JAGGED x3"], [4, "JAGGED x4"]];
      for (const [p, label] of LEVELS) {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = () => { ART.pixel = p; [...modes.children].forEach((c) => c.classList.toggle("on", c === b)); };
        if (p === ART.pixel) b.classList.add("on");
        modes.append(b);
      }
      const sb = document.createElement("button");
      sb.textContent = "SHINY: OFF";
      sb.onclick = () => { shiny = !shiny; sb.textContent = `SHINY: ${shiny ? "ON" : "OFF"}`; sb.classList.toggle("on", shiny); };
      modes.append(sb);
      (function loop() {
        for (const { s, ctx } of cells) {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, 448, 288);
          drawMonster(ctx, s, performance.now(), 0, undefined, ART.pixel, { shiny });
        }
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
