<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donjon Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #111; color: #e8e8e8; font: 11px "Press Start 2P", monospace; padding: 16px; }
      canvas { display: block; max-width: 100%; height: auto; border: 2px solid #333; margin: 12px 0; }
      button { font: inherit; color: #e8e8e8; background: #000; border: 2px solid #e8e8e8; padding: 8px 10px; cursor: pointer; margin-right: 8px; }
      p { color: #8a8a8a; line-height: 1.6; margin: 0; }
    </style>
  </head>
  <body>
    <p>THE ITCH.IO COVER (630 × 500). ADD ?seed=N TO TRY OTHER WALL DECORATIONS.</p>
    <canvas id="cover" width="630" height="500" aria-label="Donjon cover"></canvas>
    <button id="save">DOWNLOAD PNG</button>
    <script>
      // ?bare shows only the canvas at the top-left, for a headless screenshot
      if (new URLSearchParams(location.search).has("bare")) document.documentElement.classList.add("bare");
    </script>
    <style>
      .bare body { padding: 0; background: #000; }
      .bare p, .bare button { display: none; }
      .bare canvas { margin: 0; border: 0; }
    </style>
    <script type="module">
      import { drawCorridor } from "./render.js";
      import { drawMonster } from "./art.js";

      // A straight corridor with a side passage or two, seen from its end
      const N = 9;
      const grid = Array.from({ length: N }, () => Array(N).fill(0));
      for (let y = 2; y < N - 1; y++) grid[y][4] = 1;
      grid[5][3] = 1;
      grid[4][5] = 1;
      const seed = Number(new URLSearchParams(location.search).get("seed") ?? 12);
      const map = { grid, n: N, stairs: { x: -9, y: -9 }, palette: { name: "COVER", wall: "#a89f94", accent: "#ff9a3d" }, seed };

      const ctx = document.getElementById("cover").getContext("2d");
      const W = ctx.canvas.width;
      const H = ctx.canvas.height;

      function draw(t) {
        drawCorridor(ctx, map, 4, N - 2, 0, t);
        // The slime stands one step down the corridor, big and blank-eyed
        drawMonster(ctx, "slime", 0, 0, { cx: W / 2, s: 1.12, by: H - 34 }, 1);
        // Title plate
        ctx.fillStyle = "#000";
        ctx.fillRect(W * 0.17, 38, W * 0.66, 92);
        ctx.strokeStyle = "#e8e8e8";
        ctx.lineWidth = 3;
        ctx.strokeRect(W * 0.17 + 0.5, 38.5, W * 0.66, 92);
        ctx.lineWidth = 1;
        ctx.strokeRect(W * 0.17 + 7.5, 45.5, W * 0.66 - 14, 78);
        ctx.textAlign = "center";
        ctx.font = `52px "Press Start 2P", monospace`;
        ctx.fillStyle = "#ff8a1f";
        ctx.fillText("DONJON", W / 2 + 4, 110);
        ctx.fillStyle = "#e8e8e8";
        ctx.fillText("DONJON", W / 2, 106);
      }

      await document.fonts.load(`52px "Press Start 2P"`);
      draw(1200);
      document.getElementById("save").onclick = () => {
        const a = document.createElement("a");
        a.download = "donjon-cover.png";
        a.href = ctx.canvas.toDataURL("image/png");
        a.click();
      };
      window.cover = { draw, canvas: ctx.canvas };
    </script>
  </body>
</html>
