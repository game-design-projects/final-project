# Puts the official Godot (Linux, headless-capable) on PATH as `godot`, with the export templates the game uses:
# web (single-threaded), Windows x86_64, macOS universal, Linux x86_64 (release templates). Cached per version:
# the full template archive is 1.3 GB, the ones kept ~330 MB.
name: Setup Godot
description: Install a Godot release and the web, Windows, macOS and Linux export templates
inputs:
  version:
    description: Godot version, e.g. 4.7.2
    required: true
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/godot
          ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-${{ inputs.version }}-templates-v2
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable"
        mkdir -p ~/.local/bin "$HOME/.local/share/godot/export_templates/${{ inputs.version }}.stable"
        curl -fsSL --retry 3 "$base/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
        unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
        mv "$RUNNER_TEMP/godot/Godot_v${{ inputs.version }}-stable_linux.x86_64" ~/.local/bin/godot
        chmod +x ~/.local/bin/godot
        curl -fsSL --retry 3 "$base/Godot_v${{ inputs.version }}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
        unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/version.txt' \
          'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' \
          'templates/windows_release_x86_64.exe' 'templates/macos.zip' 'templates/linux_release.x86_64' \
          -d "$HOME/.local/share/godot/export_templates/${{ inputs.version }}.stable"
        rm "$RUNNER_TEMP/templates.tpz" "$RUNNER_TEMP/godot.zip"
    - name: Put Godot on PATH
      shell: bash
      run: |
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/godot" --version
