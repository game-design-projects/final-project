# Every push to main and every pull request: import the project and play whole games headless, then build for every
# platform (web, Windows, macOS, Linux), kept as workflow artifacts. Tags don't trigger this file: release.yml owns them
# and calls this one, so a tag checks and builds once and publishes the artifacts that passed, to a GitHub
# release and to itch.io; this workflow itself publishes nothing. Every build reaches Jev through the Jev API Worker (JEV_API, deployed by worker.yml),
# which holds the key, so no build carries one and this workflow uses no secrets and can only read.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  JEV_API: https://donjon-api.lishuyustevenli.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      # A script that doesn't parse is reported on import; the log is searched because Godot still exits with 0.
      - name: Import the project (no script errors)
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' "$RUNNER_TEMP/import.log"; then
            echo '::error::The project has script errors'
            exit 1
          fi
      # The changelog's version links: every released section has one, [Unreleased] compares from the newest, and the newest
      # section is the version in project.godot. It costs nothing and needs no Godot, so it runs before the game does. 0.9.5
      # went out with no [0.9.5] link and an [Unreleased] still comparing from v0.9.4, so the notes of a shipped version read
      # as unreleased, and nothing failed: release.yml asks for the heading, and markdown is never compiled.
      - name: Check the changelog's links
        run: |
          set -euo pipefail
          python3 tools/changelog_test.py
      # Whole games from the start to the stairs with an autopilot, on the local rules and on the seeded mind. The tool exits
      # with 1 when a game stalls, never reaches the stairs, or runs into a script error in any part of the game.
      # Every tool below goes through tools/check.sh: Godot exits with 0 for a script that doesn't load, so the exit code
      # alone would let a suite that never ran pass.
      - name: Play whole games headless
        run: |
          set -euo pipefail
          tools/check.sh res://tools/autoplay.gd
          tools/check.sh res://tools/autoplay.gd -- mock
          tools/check.sh res://tools/autoplay.gd -- practice
          tools/check.sh res://tools/autoplay.gd -- skill-combat
      # Seeds where the two nearest monsters sat in opposite directions: the pilot used to step between two cells for the
      # whole game, each step making the other monster the nearer one. It keeps the monster it chose until it is gone now.
      - name: Play the seeds that used to stall the pilot
        run: |
          set -euo pipefail
          for seed in 313 357 362 415 451 454; do
            tools/check.sh res://tools/autoplay.gd -- mock "seed=$seed"
          done
      - name: Check initiated dialogue and dynamic moods
        run: |
          set -euo pipefail
          tools/check.sh res://tools/social_test.gd -- nosave nosound
          tools/check.sh res://tools/moods_test.gd -- nosave nosound
      # The menu panel: hints wrap, digits and the mouse work, settings are taken over from the old game, a bad save is refused.
      - name: Check the menus
        run: |
          set -euo pipefail
          tools/check.sh res://tools/menu_test.gd
      # The save slots: write, read, rename, copy, delete, `nosave` keeping them in memory; a saved state that is wrong is refused or clamped.
      - name: Check the saves
        run: |
          set -euo pipefail
          tools/check.sh res://tools/saves_test.gd
      # The gameplay scene: the views follow the state; keys, clicks and the touch pad; tooltips; the autosave and the pause menu.
      - name: Check the gameplay scene
        run: |
          set -euo pipefail
          tools/check.sh res://tools/gameplay_test.gd
      # The numbers of the rules (strike, odds, dodge cells, words, hints) against the values the game had before the rewrite.
      - name: Check the rules
        run: |
          set -euo pipefail
          tools/check.sh res://tools/rules_test.gd
      # The kinds of monster and their attacks: five to a floor, a champion in all of them, and every attack played whole — it
      # makes hazards, keeps to the box, warns your square in time, never walls you in, and is the same attack twice on one seed.
      - name: Check the kinds and their attacks
        run: |
          set -euo pipefail
          tools/check.sh res://tools/kinds_test.gd
      # The talk with Jev against a stand-in transport: a proxy with no key is not retried, mercy and pressure are one request.
      - name: Check the network
        run: |
          set -euo pipefail
          tools/check.sh res://tools/network_test.gd
      # The 3D view: which monsters are in sight (down a corridor, across a hall), the camera turning one way while a key is held, faces on the models.
      - name: Check the 3D view
        run: |
          set -euo pipefail
          tools/check.sh res://tools/view_test.gd
      # The sound: every name the game plays has a recipe, the right events call for crit, victory, fanfare and the menu ticks,
      # Master has its limiter, the music paces itself without an old fade stopping a new loop, and lines find their recordings.
      - name: Check the sound
        run: |
          set -euo pipefail
          tools/check.sh res://tools/audio_test.gd -- nosave
          python3 tools/voices/test_gemini.py
      # What the feature flags add: each feature with its flag on and off (it switches them itself).
      - name: Check the features
        run: |
          set -euo pipefail
          tools/check.sh res://tools/features_test.gd -- nosave nosound
      # What outlasts a run: achievements, Legacy, hunger, camp and butchering, and a save without any of them.
      - name: Check what outlasts a run
        run: |
          set -euo pipefail
          tools/check.sh res://tools/meta_test.gd -- nosave nosound
      # A whole run with no strike in it, start to end.
      - name: Check the peaceful way through
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/autoplay.gd -- nosave nosound pacifist | tee /tmp/pacifist.log | grep -E '^autoplay: 5 of 5'
          ! grep -E '^autoplay: seed' /tmp/pacifist.log | grep -vE ' slain 0 '

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [web, windows, macos, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot and its export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Build (Jev through the Worker)
        run: GODOT=godot tools/build.sh --proxy "$JEV_API" ${{ matrix.platform }}
      - name: The web bundle has what a browser needs
        if: matrix.platform == 'web'
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            test -s "build/web/$f" || { echo "::error::build/web/$f is missing or empty"; exit 1; }
          done
          # CREDITS.txt is not a resource: only the export's include_filter ships it, and the Credits page is empty without it
          grep -aq 'assets/CREDITS.txt' build/web/index.pck || { echo '::error::assets/CREDITS.txt is not in the web build'; exit 1; }
          grep -aq 'assets/video/intro.ogv' build/web/index.pck || { echo '::error::the opening film is not in the web build'; exit 1; }
      # The zip, not the folder: an artifact folder loses the executable bits of the Linux and macOS builds
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: donjon-${{ matrix.platform }}
          path: build/donjon-*-${{ matrix.platform }}.zip
          retention-days: 14
          if-no-files-found: error
