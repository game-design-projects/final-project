# Every push and pull request: tests, then a build for every platform (web, Windows, macOS, Linux) kept as
# workflow artifacts. A tag vX.Y.Z (matching config/version in project.godot) builds them all again and publishes
# a GitHub release with the zips and that version's CHANGELOG section. On main, a passing web build goes to itch.io.
# Only the release and itch jobs see the secrets, and neither runs for pull requests: BUTLER_API_KEY to push, and
# OPENROUTER_API_KEY, which those builds ship inside the game so it can call Jev on OpenRouter itself (a low-credit
# key on purpose; see tools/build.sh). Every other build has no key and runs on mock Jev.
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  ITCH_TARGET: UNSET/UNSET:html5

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Import the project
        run: godot --headless --path . --import
      - name: Unit and game tests (mock Jev)
        run: godot --headless --path . -s res://tests/run_tests.gd
      # Every scripted encounter, against mock Jev (random answers, no key, no credits), on two seeds
      - name: Scenarios (mock Jev)
        run: |
          set -euo pipefail
          for seed in 1 2; do
            godot --headless --path . -s res://cli/scenarios.gd -- --seed=$seed > /dev/null
            godot --headless --path . -s res://cli/social_scenarios.gd -- --seed=$seed > /dev/null
          done

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [web, windows, macos, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot and its export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Build (no key, mock Jev)
        run: GODOT=godot tools/build.sh ${{ matrix.platform }}
      - name: Validate the HTML5 bundle
        if: matrix.platform == 'web'
        run: node tools/check-html5.mjs build/web
      # The zip, not the folder: an artifact folder loses the executable bits of the Linux and macOS builds
      - uses: actions/upload-artifact@v4
        with:
          name: donjon-${{ matrix.platform }}
          path: build/donjon-*-${{ matrix.platform }}.zip
          retention-days: 14
          if-no-files-found: error

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The tag matches the project's version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match config/version=\"$version\" in project.godot"; exit 1; }
      - name: Install Godot and its export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Build every platform (Jev via OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$OPENROUTER_API_KEY" ]]; then
            GODOT=godot tools/build.sh --openrouter
          else
            echo "::warning::No OPENROUTER_API_KEY secret: the release builds run on mock Jev"
            GODOT=godot tools/build.sh
          fi
          node tools/check-html5.mjs build/web
      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          awk -v v="[$version]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Donjon $GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" build/donjon-*.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Donjon $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: itch-production
      cancel-in-progress: false
    environment:
      name: itch-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot and its export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Build the web bundle (Jev via OpenRouter, from the browser)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo '::error::Missing OPENROUTER_API_KEY secret'; exit 1; }
          GODOT=godot tools/build.sh --openrouter web
          node tools/check-html5.mjs build/web
      - name: Install official butler
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/15.31.0/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo '::error::Missing BUTLER_API_KEY secret'; exit 1; }
          "$RUNNER_TEMP/butler/butler" push build/web "$ITCH_TARGET" --userversion "$GITHUB_SHA"
          "$RUNNER_TEMP/butler/butler" status "$ITCH_TARGET"
