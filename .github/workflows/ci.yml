# Tests on every push and pull request. Nothing here publishes: itch.io publishing is off (the final ships as a
# native build; `npm run crawler:itch` still builds the browser zip by hand), and the Jev API Worker deploys from
# worker.yml. No secrets are used.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      # The tests use only Node built-ins, so there is nothing to install
      - run: npm test
      # Every scripted encounter, against the mock Jev (random answers, no key, no credits), on two seeds
      - name: Scenarios (mock Jev)
        run: |
          set -euo pipefail
          for seed in 1 2; do
            node crawler/scripts/scenarios.js --seed=$seed > /dev/null
            node crawler/scripts/social-scenarios.js --seed=$seed > /dev/null
          done
