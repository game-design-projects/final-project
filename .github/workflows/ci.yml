# Every push to main and every pull request: import the project and play whole games headless, then build for every
# platform (web, Windows, macOS, Linux), kept as workflow artifacts. Tags don't trigger this file: release.yml owns them
# and calls this one, so a tag checks and builds once and publishes the artifacts that passed. Nothing publishes to
# itch.io: the final ships native. Every build reaches Jev through the Jev API Worker (JEV_API, deployed by worker.yml),
# which holds the key, so no build carries one and this workflow uses no secrets and can only read.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  JEV_API: https://donjon-api.lishuyustevenli.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      # A script that doesn't parse is reported on import; the log is searched because Godot still exits with 0.
      - name: Import the project (no script errors)
        run: |
          set -euo pipefail
          godot --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' "$RUNNER_TEMP/import.log"; then
            echo '::error::The project has script errors'
            exit 1
          fi
      # Whole games from the start to the stairs with an autopilot, on the local rules and on the seeded mind. The tool exits
      # with 1 when a game stalls or never reaches the stairs.
      - name: Play whole games headless
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/autoplay.gd
          godot --headless --path . -s res://tools/autoplay.gd -- mock
      # The personality slice (ROOK and VEX at fixed rolls): what ends it, the retry, the autosave rule, the seed, the mind.
      - name: Check the personality slice
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/slice_test.gd
      # The menu panel: a long key hint wraps instead of being cut off at the edge.
      - name: Check the menus
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/menu_test.gd
      # The save slots: write, read, rename, copy, delete, and `nosave` keeping them in memory, off the disk.
      - name: Check the saves
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/saves_test.gd
      # The gameplay scene: the views follow the state when a new floor or a loaded save replaces it.
      - name: Check the gameplay scene
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tools/gameplay_test.gd

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [web, windows, macos, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Godot and its export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Build (Jev through the Worker)
        run: GODOT=godot tools/build.sh --proxy "$JEV_API" ${{ matrix.platform }}
      - name: The web bundle has what a browser needs
        if: matrix.platform == 'web'
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.pck; do
            test -s "build/web/$f" || { echo "::error::build/web/$f is missing or empty"; exit 1; }
          done
      # The zip, not the folder: an artifact folder loses the executable bits of the Linux and macOS builds
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: donjon-${{ matrix.platform }}
          path: build/donjon-*-${{ matrix.platform }}.zip
          retention-days: 14
          if-no-files-found: error
