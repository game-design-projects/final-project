# Tests on every push and pull request; on main, a passing build is published to itch.io (channel html5).
# The publish job alone sees the secrets and never runs for pull requests: BUTLER_API_KEY to push, and
# OPENROUTER_API_KEY, which the web build ships in the page so the browser can call Jev on OpenRouter itself
# (a low-credit key on purpose; see tools/build-web.sh).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  ITCH_TARGET: UNSET/UNSET:html5

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot and its web export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Import the project
        run: godot --headless --path . --import
      - name: Unit and game tests (mock Jev)
        run: godot --headless --path . -s res://tests/run_tests.gd
      # Every scripted encounter, against mock Jev (random answers, no key, no credits), on two seeds
      - name: Scenarios (mock Jev)
        run: |
          set -euo pipefail
          for seed in 1 2; do
            godot --headless --path . -s res://cli/scenarios.gd -- --seed=$seed > /dev/null
            godot --headless --path . -s res://cli/social_scenarios.gd -- --seed=$seed > /dev/null
          done
      # A keyless build, to validate the web bundle on every push and PR
      - name: Build the web bundle
        run: GODOT=godot tools/build-web.sh
      - name: Validate the HTML5 bundle
        run: node tools/check-html5.mjs build/web

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: itch-production
      cancel-in-progress: false
    environment:
      name: itch-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Godot and its web export templates
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Build the web bundle (Jev via OpenRouter, from the browser)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo '::error::Missing OPENROUTER_API_KEY secret'; exit 1; }
          GODOT=godot tools/build-web.sh --openrouter
          node tools/check-html5.mjs build/web
      - name: Install official butler
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/15.31.0/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo '::error::Missing BUTLER_API_KEY secret'; exit 1; }
          "$RUNNER_TEMP/butler/butler" push build/web "$ITCH_TARGET" --userversion "$GITHUB_SHA"
          "$RUNNER_TEMP/butler/butler" status "$ITCH_TARGET"
