# Pushing a tag vX.Y.Z publishes a GitHub release with every platform's zip and that version's CHANGELOG section.
# The tag is the only trigger (ci.yml doesn't run on tags itself): it must match config/version in project.godot,
# then ci.yml runs as a called workflow (the checks, then web, Windows, macOS and Linux builds) and the release publishes
# the very zips that passed, so a tag builds once. Only the publish job may write, and only the release itself; the itch job pushes
# the same zips to itch.io (stevenli-phoenix-work/donjon, one channel a platform) and is the only one that sees BUTLER_API_KEY.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the project's version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match config/version=\"$version\" in project.godot"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for [$version]"; exit 1; }

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: donjon-*
          merge-multiple: true
          path: dist
      - name: Every platform is there
        run: |
          set -euo pipefail
          for platform in web windows macos linux; do
            compgen -G "dist/donjon-*-$platform.zip" > /dev/null || { echo "::error::No $platform zip among the build artifacts"; exit 1; }
          done
          ls -l dist
      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          awk -v v="[$version]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "Donjon $GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/donjon-*.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Donjon $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  # The same zips that passed, to itch.io: one channel a platform. The page is stevenli-phoenix-work's (BUTLER_API_KEY is an org
  # secret on game-design-projects, inherited here); the key is in the push step alone, and the job can read the repository and nothing more.
  itch:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: itch-production
      cancel-in-progress: false
    environment:
      name: itch-production
      url: https://stevenli-phoenix-work.itch.io/donjon
    env:
      ITCH_GAME: stevenli-phoenix-work/donjon
      BUTLER_VERSION: 15.31.0
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: donjon-*
          merge-multiple: true
          path: dist
      - name: Every platform is there
        run: |
          set -euo pipefail
          for platform in web windows macos linux; do
            compgen -G "dist/donjon-*-$platform.zip" > /dev/null || { echo "::error::No $platform zip among the build artifacts"; exit 1; }
          done
          ls -l dist
      - name: Install butler
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://broth.itch.zone/butler/linux-amd64/$BUTLER_VERSION/archive/default" -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
      - name: Push every platform
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BUTLER_API_KEY" || { echo '::error::Missing BUTLER_API_KEY (an org secret on game-design-projects)'; exit 1; }
          version=${GITHUB_REF_NAME#v}
          # platform -> itch channel
          for pair in web:html5 windows:windows macos:osx linux:linux; do
            platform=${pair%%:*}
            channel=${pair##*:}
            zip=$(compgen -G "dist/donjon-*-$platform.zip" | head -n 1)
            echo "== $zip -> $ITCH_GAME:$channel ($version)"
            "$RUNNER_TEMP/butler/butler" push "$zip" "$ITCH_GAME:$channel" --userversion "$version"
          done
          "$RUNNER_TEMP/butler/butler" status "$ITCH_GAME"
